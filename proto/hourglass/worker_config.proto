syntax = "proto3";

package hourglass.proto;

message WorkerConfig {
  string namespace = 1;
  string task_queue = 2;
  uint32 max_cached_workflows = 3;
  string client_target_url = 4;

  // Maximum outstanding workflow tasks the worker will hold from the
  // server. 0 means "use the Rust default" (currently 10). See #298, #326.
  uint32 max_outstanding_workflow_tasks = 5;

  // Maximum outstanding activity tasks the worker will hold from the
  // server. 0 means "use the Rust default" (currently 10).
  uint32 max_outstanding_activities = 6;

  // Maximum outstanding local-activity tasks. 0 means "use the Rust
  // default" (currently 10).
  uint32 max_outstanding_local_activities = 7;

  // How long, in milliseconds, a worker that has begun to shut down lets
  // its running activities finish before Core issues each of them a cancel
  // with reason WORKER_SHUTDOWN. Core reports an activity cancelled that way
  // to the server as a retryable "WorkerShutdown" failure, so it is retried
  // at once rather than left to its timeout. Unset means Core never issues
  // those cancels; Hourglass always sets it (Hourglass.Worker).
  optional uint32 graceful_shutdown_period_ms = 8;
}
